<!doctype html>
<html lang="en" id="top" class="defer-dino-atlases">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>James Kull | Photos</title>
    <meta name="description" content="Places, details, and moments along the way." />
    <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/dinos.css" />
    <script defer src="/js/dinos.js"></script>
    <link rel="stylesheet" href="/css/collections.css?v=spread-1" />
    <script defer src="/js/photo-data.js?v=management-1"></script>
    <script defer src="/js/collections.js?v=spread-1"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="page-header site-shell">
      <nav class="top-nav" aria-label="Primary">
        <a class="brand" href="/">
          <img class="icon-endcap" src="/assets/icons/favicon-32.png" width="16" height="16" alt="" />
          <span>JFK</span>
        </a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li><a href="/writings/">Writings</a></li>
          <li><a href="/books/">Books</a></li>
          <li><a class="is-active" aria-current="page" href="/photography/">Photos</a></li>
          <li><a href="/contact/">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="site-shell collection-page" data-collection="photography">
      <section class="hero hero--monument collection-hero" aria-labelledby="photography-title">
        <div class="grid home-identity">
          <h1 id="photography-title">Photos</h1>
          <p class="hero-lead">Places, details, and moments along the way.</p>
        </div>
        <figure class="page-monument monument--machu-picchu">
          <img class="monument-img" src="/assets/illustrations/runtime/hero-photography-machu-picchu.png"
            width="1536" height="1024" decoding="async" alt="Golden pixel art of Machu Picchu’s stone terraces and citadel, with Huayna Picchu rising behind." />
          <figcaption class="hero-caption">An often photographed place.</figcaption>
        </figure>
      </section>
      <div class="collection-controls gallery-controls" role="group" aria-label="Photos filters">
        <label>Search<input id="collection-search" type="search" placeholder="Photos, places, or categories" /></label>
        <p id="collection-count" role="status"></p>
      </div>
      <section id="collection-list" class="album-grid" aria-label="Photos"><p>Loading photos…</p></section>
      <noscript><p>Enable JavaScript to view this collection.</p></noscript>
      <dialog id="photo-viewer" aria-label="Photograph viewer">
        <button class="viewer-close" type="button" aria-label="Close photograph">Close ×</button>
        <figure><img id="viewer-image" alt="" /><figcaption id="viewer-caption"></figcaption></figure>
        <div class="viewer-controls"><button id="viewer-prev" type="button">← Previous</button><span id="viewer-count"></span><button id="viewer-next" type="button">Next →</button></div>
      </dialog>
    </main>
    <footer class="footer site-shell">
      <p>James Kull | Classics and Economics, Washington and Lee University.</p>
      <button class="footer-contact footer-copy copy-trigger" type="button" data-copy-email data-email="jkull@mail.wlu.edu">
        Email
      </button>
    </footer>
  </body>
</html>

<!doctype html>
<html lang="en" id="top" class="defer-dino-atlases">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>James Kull | Home</title>
    <meta
      name="description"
      content="Classical museum-catalog personal site with selected projects, writings, and direct contact details."
    />
    <link rel="icon" type="image/png" href="./assets/icons/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      href="./assets/illustrations/runtime/hero-home-arena-960.webp"
      media="(max-resolution: 1.99dppx)"
    />
    <link
      rel="preload"
      as="image"
      href="./assets/illustrations/runtime/hero-home-arena-1536.webp"
      media="(min-resolution: 2dppx)"
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css?v=20261019-responsive" />
    <link rel="stylesheet" href="./css/dinos.css?v=20261019-journeys-2" />
    <script defer src="./js/dino-journeys.js?v=20261019-journeys-2"></script>
    <script defer src="./js/dinos.js?v=20261019-journeys-2"></script>
    <script defer src="./js/content.js"></script>
  </head>
  <body class="home-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="page-header site-shell">
      <nav class="top-nav" aria-label="Primary">
        <a class="brand" href="/" aria-label="James Kull home">
          <img class="icon-endcap" src="./assets/icons/favicon-32.png" width="16" height="16" alt="" />
          <span>JFK</span>
        </a>
        <ul class="nav-links">
          <li><a class="is-active" href="/">Home</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li><a href="/writings/">Writings</a></li>
          <li><a href="/books/">Books</a></li>
          <li><a href="/photography/">Photos</a></li>
          <li><a href="/contact/">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="site-shell">
      <section class="hero hero--arena" aria-labelledby="home-title">
        <div class="home-identity grid">
          <h1 id="home-title" data-site-name>James Kull</h1>
          <p class="hero-lead" data-site-tagline>
            Making things.
          </p>
        </div>

        <section class="arena-stage" aria-label="Arena route selector">
          <div class="arena-exhibit">
            <div class="arena-pantry" role="group" aria-label="Feed the dinosaurs">
              <div class="arena-pantry-food">
                <button type="button" class="arena-snack" data-food="leaf" aria-label="Offer a leaf" aria-describedby="feeding-help" aria-pressed="false"><span class="pixel-food pixel-food--leaf" aria-hidden="true"></span></button>
                <button type="button" class="arena-snack" data-food="meat" aria-label="Offer meat to the raptor" aria-describedby="feeding-help" aria-pressed="false"><span class="pixel-food pixel-food--meat" aria-hidden="true"></span></button>
              </div>
              <span class="arena-feeding-status" id="feeding-help">Drag a snack into the arena, or click or tap one to offer it.</span>
            </div>
            <div class="arena-scene" aria-label="Interactive dinosaur arena">
              <div class="arena-colosseum" aria-hidden="true"></div>
              <div class="arena-floor" aria-hidden="true"></div>
              <span class="arena-feeding-status" role="status" aria-live="polite"></span>
              <button
                class="arena-statue arena-roamer"
                type="button"
                data-dino-lounge="projects"
                data-tooltip=":)"
                aria-label="Pet the stegosaurus"
              >
                <span
                  class="dino dino--sheet dino--stego dino--arena dino--lounge"
                  data-dino
                  data-dino-lounge="projects"
                  data-dino-state="lounge"
                  aria-hidden="true"
                ></span>
              </button>
              <button
                class="arena-statue arena-roamer"
                type="button"
                data-dino-lounge="writings"
                data-tooltip=":)"
                aria-label="Pet the raptor"
              >
                <span
                  class="dino dino--sheet dino--raptor dino--arena dino--lounge"
                  data-dino
                  data-dino-lounge="writings"
                  data-dino-state="lounge"
                  aria-hidden="true"
                ></span>
              </button>
              <button
                class="arena-statue arena-roamer"
                type="button"
                data-dino-lounge="contact"
                data-tooltip=":)"
                aria-label="Pet the longneck"
              >
                <span
                  class="dino dino--sheet dino--longneck dino--arena dino--lounge"
                  data-dino
                  data-dino-lounge="contact"
                  data-dino-state="lounge"
                  aria-hidden="true"
                ></span>
              </button>
            </div>
          </div>
          <div class="arena-controls">
            <nav class="arena-routes arena-routes--home" aria-label="Primary site routes">
              <a class="arena-route" href="/projects/">
                <span class="arena-route-label">Projects</span>
              </a>
              <a class="arena-route" href="/writings/">
                <span class="arena-route-label">Writings</span>
              </a>
              <a class="arena-route" href="/contact/">
                <span class="arena-route-label">Contact</span>
              </a>
              <a class="arena-route" href="/photography/">
                <span class="arena-route-label">Photos</span>
              </a>
              <a class="arena-route" href="/books/">
                <span class="arena-route-label">Books</span>
              </a>
            </nav>
          </div>
        </section>
      </section>

    </main>

    <footer class="footer site-shell">
      <p>James Kull | Classics and Economics, Washington and Lee University.</p>
      <button class="footer-contact footer-copy copy-trigger" type="button" data-copy-email data-email="jkull@mail.wlu.edu">
        Email
      </button>
    </footer>
  </body>
</html>

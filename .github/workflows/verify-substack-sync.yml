name: Verify Substack Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Show Python runtime
        run: python --version

      - name: Verify Substack sync with diagnostics
        run: |
          python scripts/sync_substack_content.py \
            --diagnostics \
            --retries 6 \
            --timeout 30 \
            --source-order posts,feed-web,archive \
            --min-public-posts 1


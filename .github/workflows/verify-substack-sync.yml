name: Verify Substack Sync

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to verify Substack access from
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show Python runtime
        run: python --version

      - name: Check browser HTTP transport
        run: |
          python -m pip install curl_cffi==0.13.0
          python - <<'PYPROBE'
          from curl_cffi import requests
          url = "https://jameskull.substack.com/api/v1/posts?limit=20&offset=0"
          response = requests.get(url, impersonate="chrome", timeout=20)
          print("Browser transport:", response.status_code, response.headers.get("content-type"))
          if response.status_code == 200:
              print("Posts:", len(response.json()))
          PYPROBE

      - name: Verify Substack sync with diagnostics
        run: |
          python scripts/sync_substack_content.py \
            --diagnostics \
            --retries 1 \
            --timeout 15 \
            --source-order posts,feed-web,archive \
            --min-public-posts 1

name: Deploy Studio storage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/storage/**'
      - 'tests/security*.test.*'
      - 'js/studio-core.js'
      - 'js/showcase-data.js'
      - 'js/writing-data.js'
      - 'tests/storage.test.mjs'
      - '.github/workflows/deploy-studio-storage.yml'

permissions:
  contents: read

concurrency:
  group: studio-storage-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify storage guards
        run: node --test tests/*.test.js tests/*.test.mjs
      - name: Install locked deployment tooling
        working-directory: backend/storage
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deployment credential is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the repository secret STUDIO_CLOUDFLARE_API_TOKEN before deployment."
            exit 1
          fi
      - name: Bundle and deploy private-bucket gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STUDIO_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9e6f5645954b0f0396a99486a0a47d2
        run: |
          backend/storage/node_modules/.bin/wrangler deploy --config backend/storage/wrangler.jsonc --dry-run
          backend/storage/node_modules/.bin/wrangler deploy --config backend/storage/wrangler.jsonc

